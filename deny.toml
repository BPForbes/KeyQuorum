# cargo-deny policy, run by .github/workflows/security.yml:
#   cargo deny --locked check
# Checks the whole dependency graph in Cargo.lock for known vulnerabilities,
# licences nobody agreed to, and crates that do not come from crates.io.

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound crates always fail. Unmaintained and yanked
# crates fail too; add an `ignore` entry with a reason and a date only when a
# fix is not available yet.
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # zip 8.6.0 enters only as a build-dependency of utoipa-swagger-ui 10.0.1
  # (the native dev host's /swagger-ui), which requires zip ^8.6; its build
  # script unpacks its own Swagger UI archive with its own loop, never
  # ZipArchive::extract or ZipStreamReader::extract. The fix is zip 9, which
  # no utoipa-swagger-ui release accepts yet. Remove these once one does.
  # Added 2026-10-19; keep .cargo/audit.toml identical.
  { id = "RUSTSEC-2026-0367", reason = "zip 9 not selectable: utoipa-swagger-ui 10.0.1 requires zip ^8.6 (build-dependency only), added 2026-10-19" },
  { id = "RUSTSEC-2026-0368", reason = "zip 9 not selectable: utoipa-swagger-ui 10.0.1 requires zip ^8.6 (build-dependency only), added 2026-10-19" },
  { id = "RUSTSEC-2026-0369", reason = "zip 9 not selectable: utoipa-swagger-ui 10.0.1 requires zip ^8.6 (build-dependency only), added 2026-10-19" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  # Mozilla's CA root list (webpki-roots), used by the relay's TLS client.
  "CDLA-Permissive-2.0",
]

# This crate is not published, so a missing licence field is not an error.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
