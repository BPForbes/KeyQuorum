[package]
name = "keyquorum"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "keyquorum"
path = "src/lib.rs"

[features]
default = []
# Compiles mailbox-host *capabilities* (hidden `host` subcommand). This is
# not authorization: a trusted provider also needs a KeyQuorum-signed
# provider.kqcert and the matching relay private key. Default
# `cargo build --release` stays the customer edition.
provider = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:utoipa-swagger-ui",
    "dep:tracing",
    "dep:tracing-subscriber",
    "utoipa/axum_extras",
]
# Browser lab (`src/lab/`): seeded mock users, mock USB containers, and an
# in-memory relay over the crate's own logic, exported through
# wasm-bindgen when built for wasm32. Demonstration only; never combined
# with `provider` in a wasm32 build (see the guard in lib.rs).
lab = ["dep:wasm-bindgen"]

[[bin]]
name = "keyquorum"
path = "src/bin/keyquorum/main.rs"

[[bin]]
name = "keyquorum-device"
path = "src/bin/keyquorum-device.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
base64 = "0.22"
zeroize = "1"
clap = { version = "4", features = ["derive"] }
blahaj = "0.6"
crypto_box = { version = "0.9", features = ["seal"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", optional = true, features = ["trace"] }
utoipa = "5"
utoipa-swagger-ui = { version = "9", optional = true, features = ["axum"] }
url = "2"
tracing = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

# Terminal prompts and the HTTPS relay client are native-only: the browser
# lab (wasm32) never prompts a TTY and never talks to a real relay.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rpassword = "7.5"
ureq = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
