[package]
name = "keyquorum"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "keyquorum"
path = "src/lib.rs"

[features]
default = ["host"]
# `std` is the standard library (without it the pure modules are `no_std` + `alloc`).
std = []
# `host` is the whole hosted crate: SQLite, the CLI, the relay, files and the
# network. It is on by default, so every existing build is unchanged.
# `--no-default-features` leaves only the pure modules (`signing`, `crypto`,
# `envelope`, `error`, `keys`' parsing helpers, `authority`'s label rules,
# `file_history` and `file_delivery`'s store-free parts). Every other feature
# below needs `host`.
host = [
    "std",
    "rand/std",
    "rand/std_rng",
    "rand/sys_rng",
    "rand/thread_rng",
    "rand_core/getrandom",
    "sha2/alloc",
    "sha2/oid",
    "hex/std",
    "base64/std",
    "base64/simd-unsafe",
    "subtle/std",
    "dep:blahaj",
    "blahaj/std",
    "aes-gcm/getrandom",
    "argon2/getrandom",
    "argon2/password-hash",
    "crypto_box/getrandom",
    "dep:rusqlite",
    "dep:clap",
    "dep:url",
    "dep:serde",
    "dep:serde_json",
    "dep:utoipa",
    "dep:rpassword",
    "dep:ureq",
]
# Exercises compatibility commands retained while callers migrate to the
# everyday one-shot CLI. CI may enable this explicitly; the default suite
# concentrates on the replacement commands.
legacy-tests = ["host"]
# Compiles mailbox-host *capabilities* (hidden `host` subcommand). This is
# not authorization: a trusted provider also needs a KeyQuorum-signed
# provider.kqcert and the matching relay private key. Default
# `cargo build --release` stays the customer edition.
provider = [
    "host",
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:utoipa-swagger-ui",
    "dep:tracing",
    "dep:tracing-subscriber",
    "utoipa/axum_extras",
]
# Browser lab (`src/lab/`): seeded mock users, mock USB containers, and an
# in-memory relay over the crate's own logic, exported through
# wasm-bindgen when built for wasm32. Demonstration only; never combined
# with `provider` in a wasm32 build (see the guard in lib.rs).
lab = ["host", "dep:wasm-bindgen"]
# The relay core as a WebAssembly module for a Cloudflare Worker's Durable
# Object (`src/relay/worker.rs`): `relay::service::dispatch` over a
# `relay::sql::Sql` executor backed by the Durable Object's SQL API. Build
# capability only, like `provider`; never combined with `provider` or `lab` in a
# wasm32 build (the public Worker must not carry mailbox-host code or the lab).
workers = ["host", "dep:wasm-bindgen", "dep:js-sys"]
# The operator console's WebAssembly (`src/provider/provision_wasm.rs`): the
# one export that makes a provider identity in the browser with the crate's
# own `provider::provision`, built by `workers/scripts/build-console-wasm.mjs`
# into the admin Worker's static files. Nothing else is exported, and it is
# never combined with `provider`, `lab` or `workers` in a wasm32 build.
console = ["host", "dep:wasm-bindgen"]
# Interactive review terminal UI (`keyquorum file review --interactive`).
# Presentation only, over `cli::review_view`; native-only, never part of
# the wasm32 lab build.
tui = ["host", "dep:ratatui"]

# The `no_std` entropy path, with the test standing in for the embedder's C hook.
[[test]]
name = "platform_entropy"
path = "tests/platform_entropy.rs"
required-features = ["std"]

[[bin]]
name = "keyquorum"
path = "src/bin/keyquorum/main.rs"
required-features = ["host"]

[[bin]]
name = "keyquorum-device"
path = "src/bin/keyquorum-device.rs"
required-features = ["host"]

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
# The crypto dependencies are listed with `default-features = false` and only the
# features the pure modules need, so `--no-default-features` can build for a target
# with no operating system. The `host` feature turns the hosted defaults back on.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
rand = { version = "0.10", default-features = false }
# crypto_box takes a rand_core 0.6 RNG. ed25519-dalek 3 takes rand_core 0.10,
# the same one rand 0.10 uses (crypto::os_rng). blahaj 0.7's Shamir dealer
# takes rand 0.10's.
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.11", default-features = false }
# Keyed commitments to sensitive content (RustCrypto, same `digest` 0.11 as sha2).
hmac = "0.13"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
libc = "0.2"
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# Constant-time comparison of derived secrets (already in the graph via aes-gcm).
subtle = { version = "2", default-features = false, features = ["i128"] }
clap = { version = "4", features = ["derive"], optional = true }
blahaj = { version = "0.7", default-features = false, features = ["zeroize_memory"], optional = true }
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "rand_core", "salsa20", "seal"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "zeroize", "rand_core"] }
x25519-dalek = "3"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7", optional = true, features = ["trace", "timeout"] }
utoipa = { version = "6", optional = true }
utoipa-swagger-ui = { version = "10", optional = true, features = ["axum"] }
url = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
ratatui = { version = "0.30", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

# Terminal prompts and the HTTPS relay client are native-only: the browser
# lab (wasm32) never prompts a TTY and never talks to a real relay.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rpassword = { version = "7.5", optional = true }
ureq = { version = "3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# rand 0.10's SysRng, through getrandom 0.4, in the browser.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
