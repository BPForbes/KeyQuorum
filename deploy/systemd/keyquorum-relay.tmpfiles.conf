# systemd-tmpfiles entries for the KeyQuorum relay.
#
#   install -m 0644 deploy/systemd/keyquorum-relay.tmpfiles.conf /etc/tmpfiles.d/keyquorum-relay.conf
#   systemd-tmpfiles --create /etc/tmpfiles.d/keyquorum-relay.conf
#
# The state directory holds the relay database (API-key hashes, the audit
# trail, every stored letter): owned by the service user, no access for
# anyone else. The unit's StateDirectory= creates it too; this file makes
# the ownership and mode explicit and survives a unit without it.
#
# /etc/keyquorum (provider.kqcert, provider.kqrl, relay.env and, on a
# development host, relay.key) is NOT created here on purpose: it holds
# root-owned trust material the operator installs by hand, with the modes
# the runbook gives (0755 directory, 0644 certificate and revocation list,
# 0640 root:keyquorum relay.env, 0600 root:root relay.key).
#
# Type Path                Mode User      Group     Age Argument
d      /var/lib/keyquorum  0700 keyquorum keyquorum -   -
