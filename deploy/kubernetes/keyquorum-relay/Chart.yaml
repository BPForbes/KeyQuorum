apiVersion: v2
name: keyquorum-relay
description: >-
  The hosted KeyQuorum relay: stateless replicas of the provider-capable
  keyquorum binary serving the mailbox over plain HTTP behind a
  TLS-terminating ingress, with all state in a MongoDB replica set.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
keywords:
  - keyquorum
  - relay
home: https://github.com/bpforbes/keyquorum
sources:
  - https://github.com/bpforbes/keyquorum
