# KeyQuorum relay Helm values. Every value here is a non-secret setting or
# the *name* of a Secret the cluster already holds; no credential, key or
# connection string is written into this file or rendered into a ConfigMap.
# The operator runbook is docs/operator/relay-deployment.md.

replicaCount: 3

image:
  repository: ghcr.io/example/keyquorum-relay
  tag: ""        # defaults to the chart's appVersion
  digest: ""     # prefer pinning: "sha256:..."
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

relay:
  # The container listens here; the Service and probes use this port.
  port: 8787
  # Per-client requests per minute before a 429 (0 turns the relay's own
  # limiter off). Behind the ingress the client is the last X-Forwarded-For
  # entry, which the ingress controller sets. Each replica counts on its
  # own, so a global ceiling belongs at the ingress.
  rateLimitPerMinute: 600
  # How often each replica purges expired letters and signs the audit
  # chain heads. Every replica scans; each step is idempotent.
  scanIntervalSeconds: 60
  # RUST_LOG for the relay (INFO shows denials and purges; never secrets).
  logLevel: info
  # The database within the MongoDB deployment.
  mongodbDatabase: keyquorum

# The public, signed trust material the relay presents: provider.kqcert
# and (optionally) provider.kqrl, held in a ConfigMap the operator creates
# from the files the offline root issued:
#   kubectl create configmap keyquorum-provider \
#     --from-file=provider.kqcert --from-file=provider.kqrl
# They are not secret, but they are integrity-sensitive: create the
# ConfigMap from files you verified, and restrict who may edit it.
trust:
  existingConfigMap: keyquorum-provider
  certificateKey: provider.kqcert
  # Set to "" when no revocation list is distributed yet.
  revocationListKey: provider.kqrl

secrets:
  # The relay's Ed25519 private key, as `host identity generate
  # --private-key-out` wrote it (hex), in a Secret under `key`. Mounted as a
  # file; never an environment variable.
  relayKey:
    existingSecret: keyquorum-relay-key
    key: relay.key
  # The MongoDB connection string (it carries the database user's
  # password), in a Secret under `key`. Mounted as a file and read through
  # KEYQUORUM_MONGODB_URI_FILE.
  mongodbUri:
    existingSecret: keyquorum-mongodb
    key: uri
  # Create the two Secrets above from an external secret manager with the
  # External Secrets Operator (external-secrets.io). The SecretStore is the
  # operator's: AWS Secrets Manager, GCP Secret Manager, Azure Key Vault,
  # HashiCorp Vault, ... `remoteRef` names the entries there.
  externalSecrets:
    enabled: false
    secretStoreRef:
      name: keyquorum-secret-store
      kind: ClusterSecretStore
    refreshInterval: 1h
    relayKey:
      remoteRef: keyquorum/relay/private-key
    mongodbUri:
      remoteRef: keyquorum/relay/mongodb-uri
  # Or mount them straight from the manager with the Secrets Store CSI
  # driver (secrets-store.csi.x-k8s.io). When enabled, the relay reads the
  # key and the URI from the CSI volume instead of the Secrets above.
  csi:
    enabled: false
    provider: vault      # aws | azure | gcp | vault
    # Provider-specific parameters, copied into the SecretProviderClass.
    parameters: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    # Envelopes are at most 1 MiB and a JSON push at most 2 MiB.
    nginx.ingress.kubernetes.io/proxy-body-size: 3m
    # cert-manager.io/cluster-issuer: letsencrypt
  host: relay.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: keyquorum-relay-tls

networkPolicy:
  enabled: true
  # Who may reach the relay: the ingress controller's pods.
  ingress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/name: ingress-nginx
  # Where the relay may connect: its MongoDB deployment (an address block
  # and port) and the cluster's DNS. Nothing else.
  egress:
    mongodb:
      cidrs:
        - 10.0.0.0/8
      port: 27017
    dns:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  # CPU is the one metric the relay exposes through the kubelet today.
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Spread replicas across nodes and zones when the cluster has them.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: keyquorum-relay
priorityClassName: ""
