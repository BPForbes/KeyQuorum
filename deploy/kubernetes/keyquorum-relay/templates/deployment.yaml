apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keyquorum-relay.fullname" . }}
  labels:
    {{- include "keyquorum-relay.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # A rollout keeps every existing replica serving until its replacement
  # is ready; state lives in MongoDB, so a replaced pod loses nothing.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "keyquorum-relay.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keyquorum-relay.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "keyquorum-relay.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: {{ include "keyquorum-relay.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - host
            - serve
            - --bind
            - {{ printf "0.0.0.0:%d" (int .Values.relay.port) | quote }}
            # TLS terminates at the ingress; the relay serves plain HTTP
            # inside the cluster and trusts the ingress's X-Forwarded-For.
            - --behind-tls-proxy
            - --rate-limit-per-minute
            - {{ .Values.relay.rateLimitPerMinute | quote }}
            - --scan-interval-seconds
            - {{ .Values.relay.scanIntervalSeconds | quote }}
            {{- if not .Values.relay.console }}
            - --no-console
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "keyquorum-relay.fullname" . }}
          ports:
            - name: http
              containerPort: {{ .Values.relay.port }}
              protocol: TCP
          # /ready answers only when the store answers, so a replica that
          # lost MongoDB leaves the Service. /health is the process alone.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: trust
              mountPath: /etc/keyquorum
              readOnly: true
            - name: relay-key
              mountPath: /var/run/keyquorum/relay
              readOnly: true
            - name: mongodb-uri
              mountPath: /var/run/keyquorum/mongodb
              readOnly: true
      volumes:
        - name: trust
          configMap:
            name: {{ .Values.trust.existingConfigMap }}
            items:
              - key: {{ .Values.trust.certificateKey }}
                path: {{ .Values.trust.certificateKey }}
              {{- if .Values.trust.revocationListKey }}
              - key: {{ .Values.trust.revocationListKey }}
                path: {{ .Values.trust.revocationListKey }}
              {{- end }}
        {{- if .Values.secrets.csi.enabled }}
        - name: relay-key
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "keyquorum-relay.fullname" . }}-relay-key
        - name: mongodb-uri
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "keyquorum-relay.fullname" . }}-mongodb-uri
        {{- else }}
        - name: relay-key
          secret:
            secretName: {{ .Values.secrets.relayKey.existingSecret }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.relayKey.key }}
                path: {{ .Values.secrets.relayKey.key }}
        - name: mongodb-uri
          secret:
            secretName: {{ .Values.secrets.mongodbUri.existingSecret }}
            defaultMode: 0400
            items:
              - key: {{ .Values.secrets.mongodbUri.key }}
                path: {{ .Values.secrets.mongodbUri.key }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
