{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller may reach the relay, and the relay may reach
# only its MongoDB deployment and the cluster DNS. Nothing else in or out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "keyquorum-relay.fullname" . }}
  labels:
    {{- include "keyquorum-relay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "keyquorum-relay.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingress.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.relay.port }}
  egress:
    - to:
        {{- range .Values.networkPolicy.egress.mongodb.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.mongodb.port }}
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.podSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
