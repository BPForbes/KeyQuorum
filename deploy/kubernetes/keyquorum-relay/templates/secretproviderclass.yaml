{{- if .Values.secrets.csi.enabled }}
# Mount the relay key and the MongoDB connection string straight from the
# secret manager with the Secrets Store CSI driver: no Kubernetes Secret
# object holds them. `parameters` is provider-specific (see the driver's
# documentation for aws, azure, gcp and vault); the object names below are
# placeholders.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "keyquorum-relay.fullname" . }}-relay-key
  labels:
    {{- include "keyquorum-relay.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secrets.csi.provider }}
  parameters:
    {{- toYaml .Values.secrets.csi.parameters | nindent 4 }}
    objects: |
      - objectName: {{ .Values.secrets.relayKey.key }}
        secretPath: keyquorum/relay/private-key
        secretKey: value
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "keyquorum-relay.fullname" . }}-mongodb-uri
  labels:
    {{- include "keyquorum-relay.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secrets.csi.provider }}
  parameters:
    {{- toYaml .Values.secrets.csi.parameters | nindent 4 }}
    objects: |
      - objectName: {{ .Values.secrets.mongodbUri.key }}
        secretPath: keyquorum/relay/mongodb-uri
        secretKey: value
{{- end }}
