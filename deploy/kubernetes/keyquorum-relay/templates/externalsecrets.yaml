{{- if .Values.secrets.externalSecrets.enabled }}
# The relay key and the MongoDB connection string, synced from the
# operator's secret manager by the External Secrets Operator into the two
# Secrets the Deployment mounts. The values never pass through Helm.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.relayKey.existingSecret }}
  labels:
    {{- include "keyquorum-relay.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.secrets.relayKey.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.relayKey.key }}
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.relayKey.remoteRef }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.mongodbUri.existingSecret }}
  labels:
    {{- include "keyquorum-relay.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ .Values.secrets.mongodbUri.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.mongodbUri.key }}
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.mongodbUri.remoteRef }}
{{- end }}
