{{- if .Values.ingress.enabled }}
# HTTPS ends here. The ingress forwards only to the relay Service, over
# plain HTTP inside the cluster, and sets X-Forwarded-For, which the relay
# trusts for rate limiting because it was started with --behind-tls-proxy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "keyquorum-relay.fullname" . }}
  labels:
    {{- include "keyquorum-relay.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "keyquorum-relay.fullname" . }}
                port:
                  name: http
{{- end }}
