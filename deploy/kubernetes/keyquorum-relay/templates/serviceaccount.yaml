{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keyquorum-relay.serviceAccountName" . }}
  labels:
    {{- include "keyquorum-relay.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The relay calls no Kubernetes API.
automountServiceAccountToken: false
{{- end }}
