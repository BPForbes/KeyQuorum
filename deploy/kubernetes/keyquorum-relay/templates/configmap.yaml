# Non-secret runtime settings only. Secrets are mounted as files from the
# Secrets (or the CSI volume) named in values.yaml and never appear here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keyquorum-relay.fullname" . }}
  labels:
    {{- include "keyquorum-relay.labels" . | nindent 4 }}
data:
  RUST_LOG: {{ .Values.relay.logLevel | quote }}
  KEYQUORUM_MONGODB_DB: {{ .Values.relay.mongodbDatabase | quote }}
  KEYQUORUM_PROVIDER_CERT: {{ printf "/etc/keyquorum/%s" .Values.trust.certificateKey | quote }}
  {{- if .Values.trust.revocationListKey }}
  KEYQUORUM_PROVIDER_KRL: {{ printf "/etc/keyquorum/%s" .Values.trust.revocationListKey | quote }}
  {{- end }}
  KEYQUORUM_RELAY_KEY: {{ printf "/var/run/keyquorum/relay/%s" .Values.secrets.relayKey.key | quote }}
  KEYQUORUM_MONGODB_URI_FILE: {{ printf "/var/run/keyquorum/mongodb/%s" .Values.secrets.mongodbUri.key | quote }}
