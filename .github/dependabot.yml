# Keeps dependencies current: GitHub Actions references (including SHA-pinned
# steps and reusable-workflow calls like notify-portfolio.yml's `uses:`
# reference to BPForbes/Bailey-Forbes-Portfolio-Site.github.io -- see that
# workflow for why it is pinned to a commit rather than a branch), Rust crates,
# and the Lab's and the relay console's npm packages.
#
# Only the github-actions updates are merged automatically
# (dependabot-auto-merge.yml). Cargo and npm updates, which include the
# cryptographic crates, always wait for a person.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/lab"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/relay-console"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
