# Keeps dependencies current: GitHub Actions references (including SHA-pinned
# steps and reusable-workflow calls like notify-portfolio.yml's `uses:`
# reference to BPForbes/Bailey-Forbes-Portfolio-Site.github.io -- see that
# workflow for why it is pinned to a commit rather than a branch), Rust crates,
# the Lab's and the Worker's npm packages, and the Cloudflare Terraform provider.
#
# Every update, of any ecosystem here, is merged automatically once every check
# on its head commit is green or skipped (dependabot-auto-merge.yml). A red or
# unfinished check, or the `do-not-merge` label, leaves it for a person.
# Version updates for one ecosystem directory share one pull request (`groups`
# below, every dependency, major included). Dependabot adds a later update to
# that open pull request instead of opening another. Security updates stay
# their own pull requests, so a failing major does not hold a patched advisory.
# A group does not cross `directory` entries: the root crate and `/ffi/identity`
# are still two pull requests, and so are `/lab` and `/workers`.
# A cargo update whose Cargo.lock (the root or ffi/identity's) fails `cargo
# audit` is readjusted to the
# newest release RustSec calls patched by dependabot-security-fix.yml (a major
# bump of a direct dependency included), which never merges itself. That job
# also runs daily on main, so a new advisory gets a fix pull request without
# waiting for one of these updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
  # The standalone FFI workspace has its own Cargo.lock, which security.yml
  # audits separately; the root entry above never touches it. An update here
  # follows the path dependency and can change the root Cargo.toml without
  # rewriting the root Cargo.lock, and a root update leaves this lockfile.
  # dependabot-security-fix.yml refreshes whichever lockfile that leaves stale.
  - package-ecosystem: "cargo"
    directory: "/ffi/identity"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/lab"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/workers"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
  - package-ecosystem: "terraform"
    directory: "/deploy/cloudflare/terraform"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      terraform:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
