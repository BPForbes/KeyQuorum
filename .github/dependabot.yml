# Keeps GitHub Actions references current, including SHA-pinned steps and
# reusable-workflow calls like notify-portfolio.yml's `uses:` reference to
# BPForbes/Bailey-Forbes-Portfolio-Site.github.io -- see that workflow for
# why it is pinned to a commit rather than a branch.
#
# Scoped to github-actions only: this file does not opt this repository into
# Dependabot updates for any other ecosystem (e.g. cargo).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
