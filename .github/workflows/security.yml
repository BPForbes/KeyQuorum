# Security scanning: known-vulnerable dependencies, licence and source policy,
# committed secrets, the Lab's npm dependencies, and static analysis of the
# Lab's TypeScript.
#
# Runs on every pull request and push to main, and weekly, because new
# advisories appear without any change to this repository. It reads, scans and
# reports; it never publishes, merges or writes to the repository.
#
# CodeQL covers JavaScript/TypeScript only: GitHub's Rust analysis is not a
# stable offering yet, so the Rust crate is covered by `cargo audit`,
# `cargo deny` and clippy (in tests.yml) instead.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-dependencies:
    name: rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: RustSec advisories
        run: cargo audit --deny warnings
      - name: Advisories, licences, bans and sources (deny.toml)
        run: cargo deny --locked check

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The published image, pinned to a release tag, so no licence key or
      # third-party action is involved. .gitleaks.toml carries the allowlist.
      - name: gitleaks over the full history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --verbose --exit-code 1

  lab-dependencies:
    name: lab dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - name: npm audit (production dependencies)
        working-directory: lab
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: codeql (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          source-root: lab
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
