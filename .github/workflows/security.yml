# Security scanning: known-vulnerable dependencies, licence and source policy,
# committed secrets, the Lab's npm dependencies, and CodeQL static analysis of
# the crate, the Lab and the workflows.
#
# Runs on every pull request and push to main, and weekly, because new
# advisories appear without any change to this repository. It reads, scans and
# reports; it never publishes, merges or writes to the repository.
#
# CodeQL runs the security-and-quality suite (.github/codeql/codeql-config.yml)
# over the Rust crate, the Lab's TypeScript and the workflows themselves.
# .github/scripts/codeql_report.py prints each finding with its source, a quote
# of that source, the offending lines and its SOC 2 criterion, and fails the
# `codeql gate` check on a high or critical finding in shipped code. `cargo audit`,
# `cargo deny` cover the Rust dependencies; fmt and clippy run in lint.yml.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A push to a pull request cancels the run for the commit it replaced, so a
# superseded commit never holds a runner. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The three scanners that each finish in seconds share one job: a job costs
  # a runner, its start-up and its place in the queue however little it does.
  scan:
    name: dependency and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads the full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit,cargo-deny
      - name: RustSec advisories
        run: cargo audit --deny warnings
      - name: Advisories, licences, bans and sources (deny.toml)
        run: cargo deny --locked check
      # The published image, pinned to a release tag, so no licence key or
      # third-party action is involved. .gitleaks.toml carries the allowlist.
      - name: gitleaks over the full history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --verbose --exit-code 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - name: npm audit (Lab production dependencies)
        working-directory: lab
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust is the crate, javascript-typescript is the Lab, actions is this
        # repository's own workflows (a changed workflow is a changed control).
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
      # Same form as the review rules in AGENTS.md: source, source quote, the
      # quoted lines, the SOC 2 criterion and the fix. Fails on a high or
      # critical finding in shipped code.
      - name: Test the report script
        run: python3 -m unittest discover -s .github/scripts
      - name: Report findings with their SOC 2 criterion
        run: python3 .github/scripts/codeql_report.py sarif-results/*.sarif
      # The full SARIF (every finding with its data-flow path) is kept as
      # evidence, whether or not the report step passed.
      - name: Keep the SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.sha }}
          path: sarif-results
          if-no-files-found: warn
          retention-days: 90

  # One stable check name for all CodeQL languages, for branch protection.
  codeql-gate:
    name: codeql gate
    needs: codeql
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every CodeQL language passed
        run: test "${{ needs.codeql.result }}" = success
