# Merges a Dependabot PR, of any ecosystem in .github/dependabot.yml, once
# every check on its current head commit is green.
#
# It runs whenever one of the workflows that report checks on a pull request
# finishes. It then reads every check run and commit status on the PR's head
# commit and merges only when none is pending and each one passed (success,
# or skipped / neutral for a job that did not apply). One red or unfinished
# check, required by branch protection or not, leaves the PR open; the run of
# the last workflow to finish is the one that merges. The merge names the
# head commit it judged (`--match-head-commit`), so a commit pushed in the
# meantime (a readjustment by dependabot-security-fix.yml, say) is never
# merged unchecked, and branch protection on main still applies.
#
# This covers Cargo, npm and Terraform updates too, which include the
# cryptographic crates and the deploy tooling: their review is the checks
# (cargo audit and cargo deny, npm audit, CodeQL, the test groups, the Worker
# build), whoever pushed to the branch. A PR someone wants to hold back gets
# the `do-not-merge` label, which stops this job.
#
# `workflow_run` runs with the base repository's token and this file from
# main. It never checks out or runs the PR's code; it only reads check results
# and calls `gh pr merge`. The token has `workflows: write`: GitHub refuses a
# token without that permission to merge a pull request that edits a file
# under `.github/workflows/`, even when every check is success, skipped, or
# neutral. That is what stopped #139.
#
# One-time repo setup this depends on (cannot be done from a workflow file):
#   - Settings -> Actions -> General -> Workflow permissions -> "Read and
#     write permissions" (or leave `permissions:` below sufficient if the repo
#     default is already read/write)
#
# A merge by GITHUB_TOKEN starts no push run on main, so the job dispatches
# main's Security, Lint, Lab (which publishes, as a push would) and Workers
# runs itself. A dispatched Workers run builds and checks but deploys neither
# staging (push only) nor production (its `production` input stays false), so
# staging follows an automatic merge at the next push to main.

name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Security
      - Lint
      - Deploy KeyQuorum Lab
      - Cloudflare Workers
      - Dependabot security fix
      - Legacy checks
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-merge:
    if: >-
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # merge the pull request
      pull-requests: write # merge the pull request
      workflows: write # merge a pull request that edits a workflow file
      checks: read # read every check run on the head commit
      actions: write # dispatch main's checks, which a GITHUB_TOKEN merge does not start
      statuses: read # read every commit status on the head commit
    steps:
      - name: Merge the Dependabot PR once every check on its head is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open \
                 --json number,author,headRefOid,labels --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "No open pull request from $BRANCH into main."
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          sha=$(jq -r .headRefOid <<<"$pr")
          if [ "$(jq -r .author.login <<<"$pr")" != "app/dependabot" ]; then
            echo "#$number was not opened by Dependabot; leaving it."
            exit 0
          fi
          if jq -e '.labels | any(.name == "do-not-merge")' <<<"$pr" > /dev/null; then
            echo "#$number is labelled do-not-merge; leaving it."
            exit 0
          fi

          runs=$(gh api --paginate "repos/$REPO/commits/$sha/check-runs?filter=latest&per_page=100" \
                   --jq '.check_runs[] | {name, status, conclusion}' | jq -s .)
          statuses=$(gh api "repos/$REPO/commits/$sha/status" --jq '.statuses')
          echo "$runs" | jq -r '.[] | "\(.name): \(.status) \(.conclusion // "")"'
          echo "$statuses" | jq -r '.[] | "\(.context): \(.state)"'
          if [ "$(jq length <<<"$runs")" -eq 0 ]; then
            echo "No checks on $sha yet."
            exit 0
          fi
          pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
          failed=$(jq '[.[] | select(.status == "completed" and
                         (.conclusion | IN("success", "skipped", "neutral") | not))] | length' <<<"$runs")
          s_pending=$(jq '[.[] | select(.state == "pending")] | length' <<<"$statuses")
          s_failed=$(jq '[.[] | select(.state == "failure" or .state == "error")] | length' <<<"$statuses")
          if [ "$failed" -gt 0 ] || [ "$s_failed" -gt 0 ]; then
            echo "#$number has failing checks on $sha; not merging."
            exit 0
          fi
          if [ "$pending" -gt 0 ] || [ "$s_pending" -gt 0 ]; then
            echo "#$number still has checks running on $sha; the last one to finish decides."
            exit 0
          fi
          echo "Every check on $sha is green; merging #$number."
          gh pr merge "$number" --repo "$REPO" --squash --match-head-commit "$sha"
          for wf in security.yml lint.yml deploy-lab.yml workers.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref main
          done
