# Legacy checks: the broad `--all-features` build and test run, which includes
# the tests of deprecated verbs behind the `legacy-tests` feature. It uses the
# same parallel test groups as the standard run (tests.yml), and then runs the
# literal `cargo test --locked --all-targets --all-features` that CLAUDE.md asks
# for before a change is complete (nextest runs each test in its own process,
# so the groups alone do not show shared-process `cargo test` behaviour).
#
# The job is SKIPPED by default. A pull request shows it as skipped unless it
# carries the `legacy` label; anyone can also run it from Actions -> Legacy
# checks -> Run workflow. It never publishes or notifies.

name: Legacy checks

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  legacy:
    name: legacy
    # On the job, not the workflow: a run whose job is skipped must not cancel
    # a legacy run that is already going.
    concurrency:
      group: legacy-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'legacy')
    uses: ./.github/workflows/tests.yml
    with:
      features: --all-features
      cache-key: legacy

  cargo-test:
    name: cargo test (literal)
    concurrency:
      group: legacy-cargo-test-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'legacy')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: legacy
      - name: Pre-download Swagger UI (workaround for proxy issues)
        run: |
          SWAGGER_FILE="/tmp/swagger-ui-v5.32.6.zip"
          for attempt in {1..3}; do
            if [ -f "$SWAGGER_FILE" ] && unzip -t "$SWAGGER_FILE" > /dev/null 2>&1; then
              echo "SWAGGER_UI_DOWNLOAD_URL=file://$SWAGGER_FILE" >> $GITHUB_ENV
              exit 0
            fi
            rm -f "$SWAGGER_FILE"
            if curl -L --progress-bar -o "$SWAGGER_FILE" "https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.32.6.zip" \
              && unzip -t "$SWAGGER_FILE" > /dev/null 2>&1; then
              echo "SWAGGER_UI_DOWNLOAD_URL=file://$SWAGGER_FILE" >> $GITHUB_ENV
              exit 0
            fi
            sleep $((2 ** (attempt - 1)))
          done
          echo "Failed to download and verify swagger-ui after 3 attempts"
          exit 1
      - name: cargo test (shared-process, as CLAUDE.md requires)
        run: cargo test --locked --all-targets --all-features
