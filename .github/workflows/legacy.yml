# Legacy checks: the broad `--all-features` build and test run, which includes
# the tests of deprecated verbs behind the `legacy-tests` feature.
#
# The job is SKIPPED by default. A pull request shows it as skipped unless it
# carries the `legacy` label; anyone can also run it from Actions -> Legacy
# checks -> Run workflow. It never publishes or notifies.

name: Legacy checks

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  legacy:
    name: legacy
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'legacy')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked --all-targets --all-features --no-fail-fast
