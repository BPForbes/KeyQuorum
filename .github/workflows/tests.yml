# Reusable test run, shared by test.yml (standard) and legacy.yml (legacy).
#
# Every test group runs at the same time in its own job instead of one long
# linear nextest run. Groups are nextest filtersets over the module path, so a
# new module lands in `core` without editing anything.

name: Tests

on:
  workflow_call:
    inputs:
      features:
        description: Cargo feature flags, e.g. "--features provider,lab,tui" or "--all-features"
        required: true
        type: string
      cache-key:
        description: rust-cache key, so the standard and legacy builds do not evict each other
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  group:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lab
            filter: test(/^lab::/)
          - name: cli
            filter: test(/^cli::/)
          - name: file_history
            filter: test(/^file_history::/)
          - name: relay, provider, db
            filter: test(/^(relay|provider|db)::/)
          - name: core (authority, bridge, keys, quorum, ...)
            filter: not test(/^(lab|cli|file_history|relay|provider|db)::/)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ inputs.cache-key }}
      - uses: taiki-e/install-action@badb8c3638e0b773c6c17a6025c2306a8f1c4303 # nextest tag
        with:
          tool: nextest
      - name: Test ${{ matrix.name }}
        run: cargo nextest run --locked --all-targets ${{ inputs.features }} --no-fail-fast -E '${{ matrix.filter }}'
