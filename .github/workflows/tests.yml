# Reusable test run, shared by deploy-lab.yml (the standard `--features
# provider,lab,tui` run, as its `native` job) and legacy.yml (`--all-features`).
#
# Every test group runs at the same time in its own job instead of one long
# linear nextest run. Groups are nextest filtersets over the module path, so a
# new module lands in `core` without editing anything.
#
# Cache strategy: Each call passes a cache-key (standard or legacy). Rust-cache
# uses shared-key to let all jobs in the matrix share one cache per key, so jobs
# do not re-build on cache misses. Different feature builds (standard vs legacy)
# use separate cache keys to prevent cache eviction between them; actual cache
# hit rate and size should be measured to confirm the strategy is effective.

name: Tests

on:
  workflow_call:
    inputs:
      features:
        description: Cargo feature flags, e.g. "--features provider,lab,tui" or "--all-features"
        required: true
        type: string
      cache-key:
        description: rust-cache key, so the standard and legacy builds do not evict each other
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  group:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lab
            filter: test(/^lab::/)
          - name: cli
            filter: test(/^cli::/)
          - name: file_history
            filter: test(/^file_history::/)
          - name: relay, provider, db
            filter: test(/^(relay|provider|db)::/)
          - name: core (authority, bridge, keys, quorum, ...)
            filter: not test(/^(lab|cli|file_history|relay|provider|db)::/)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ${{ inputs.cache-key }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # nextest tag
        with:
          tool: nextest
      - name: Pre-download Swagger UI (workaround for proxy issues)
        if: contains(inputs.features, 'lab') || contains(inputs.features, 'all-features')
        run: |
          SWAGGER_FILE="/tmp/swagger-ui-v5.32.6.zip"
          for attempt in {1..3}; do
            if [ -f "$SWAGGER_FILE" ]; then
              if unzip -t "$SWAGGER_FILE" > /dev/null 2>&1; then
                echo "✓ Using cached and verified swagger-ui"
                echo "SWAGGER_UI_DOWNLOAD_URL=file://$SWAGGER_FILE" >> $GITHUB_ENV
                exit 0
              else
                echo "Cached swagger-ui validation failed, removing..."
                rm -f "$SWAGGER_FILE"
              fi
            fi
            if curl -L --progress-bar -o "$SWAGGER_FILE" "https://github.com/swagger-api/swagger-ui/archive/refs/tags/v5.32.6.zip"; then
              if unzip -t "$SWAGGER_FILE" > /dev/null 2>&1; then
                echo "✓ Downloaded and verified swagger-ui"
                echo "SWAGGER_UI_DOWNLOAD_URL=file://$SWAGGER_FILE" >> $GITHUB_ENV
                exit 0
              fi
            fi
            if [ $attempt -lt 3 ]; then
              echo "Retrying... (attempt $((attempt + 1))/3)"
              rm -f "$SWAGGER_FILE"
              sleep $((2 ** (attempt - 1)))
            fi
          done
          echo "Failed to download and verify swagger-ui after 3 attempts"
          exit 1
      - name: Test ${{ matrix.name }}
        run: cargo nextest run --locked --all-targets ${{ inputs.features }} --no-fail-fast -E '${{ matrix.filter }}'
