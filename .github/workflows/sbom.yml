# Software bill of materials: a CycloneDX list of every dependency in the Rust
# crate (all features and targets), the Lab and the relay console, kept as a
# workflow artifact so a release or an audit can say exactly what was built.
# Nothing is committed or published.

name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-cyclonedx
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab/package-lock.json
      # Every feature (provider, lab, tui) and every target (the browser Lab
      # builds for wasm32), not just the default configuration, which lists
      # well under half of the crates the supported builds can pull in.
      - name: Rust crate
        run: cargo cyclonedx --format json --all-features --target all --override-filename keyquorum.cdx
      - name: Lab
        working-directory: lab
        run: |
          npm ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file lab.cdx.json
      - name: Relay console
        working-directory: relay-console
        run: |
          npm ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file relay-console.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: |
            keyquorum.cdx.json
            lab/lab.cdx.json
            relay-console/relay-console.cdx.json
          if-no-files-found: error
          retention-days: 90
