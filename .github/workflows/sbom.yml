# Software bill of materials: a CycloneDX list of every dependency in the Rust
# crate (all features and targets) and the Lab, kept as a workflow artifact so a release or an audit can
# say exactly what was built. Nothing is committed or published.

name: SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-cyclonedx
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab/package-lock.json
      # Every feature (provider, lab, tui) and every target (the browser Lab
      # builds for wasm32), not just the default configuration, which lists
      # well under half of the crates the supported builds can pull in.
      - name: Rust crate
        run: cargo cyclonedx --format json --all-features --target all --override-filename keyquorum.cdx
      - name: Lab
        working-directory: lab
        run: |
          npm ci --ignore-scripts
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-format JSON --output-file lab.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: |
            keyquorum.cdx.json
            lab/lab.cdx.json
          if-no-files-found: error
          retention-days: 90
