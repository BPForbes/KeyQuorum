# Tells bailey-forbes.com that KeyQuorum changed, so it refreshes the metadata
# it displays and redeploys.
#
# The portfolio embeds the published KeyQuorum Lab (GitHub Pages) and prints
# KeyQuorum's repository statistics, so it must not move until the lab a
# visitor can open has moved with it. That is why this waits for
# "Deploy KeyQuorum Lab" rather than Test: that workflow runs the native
# tests (`cargo test --locked --all-targets --all-features`, the same gate
# Test is), the WASM and frontend builds, and the browser tests before it
# publishes.
#
# A green "Deploy KeyQuorum Lab" run is not proof of a publish on its own —
# the deploy job can be skipped — so the gate job below asks the API what
# the job named "Publish KeyQuorum Lab to GitHub Pages" actually concluded,
# and notifies only on success. Anything else leaves the portfolio as it was.
#
# The dispatch itself lives in the portfolio repository so all projects share
# one implementation — see
# BPForbes/Bailey-Forbes-Portfolio-Site.github.io/docs/project-metadata.md.

name: Notify portfolio

on:
  workflow_run:
    workflows: ["Deploy KeyQuorum Lab"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: notify-portfolio
  cancel-in-progress: false

jobs:
  gate:
    name: Confirm the lab was published
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      published: ${{ steps.check.outputs.published }}
      configured: ${{ steps.presence.outputs.configured }}
    steps:
      - name: Read the Pages publish job outcome
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          # Must match the `name:` of the deploy job in deploy-lab.yml.
          DEPLOY_JOB: Publish KeyQuorum Lab to GitHub Pages
        run: |
          set -euo pipefail

          conclusion="$(gh api \
            --paginate \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq ".jobs[] | select(.name == \"${DEPLOY_JOB}\") | .conclusion" \
            | head -n1)"

          echo "Pages publish job concluded: ${conclusion:-did not run}"
          if [ "${conclusion}" = "success" ]; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      # The shared notifier exits 1 when this secret is empty. It is a
      # fine-grained PAT added by hand under Actions secrets, and a workflow
      # run cannot create it. Checking here keeps a missing token from failing
      # Notify after a green deploy. The portfolio still refreshes metadata on
      # its daily sync. Once the secret is set, `notify` below calls the
      # shared notifier unchanged.
      - name: See whether PORTFOLIO_DISPATCH_TOKEN is configured
        id: presence
        env:
          # Presence only. Do not print TOKEN; the value is the dispatch PAT.
          TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
            echo "PORTFOLIO_DISPATCH_TOKEN is configured."
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Portfolio dispatch token is not set::PORTFOLIO_DISPATCH_TOKEN is not set in ${GITHUB_REPOSITORY}. Add it under Settings → Secrets and variables → Actions to notify immediately. Metadata still refreshes on the portfolio's daily sync."
          fi

  notify:
    needs: gate
    if: >-
      needs.gate.outputs.published == 'true' &&
      needs.gate.outputs.configured == 'true'
    # Pinned to a commit on the portfolio repo's main rather than @main: this
    # job hands PORTFOLIO_DISPATCH_TOKEN to the called workflow, and a branch
    # reference would let a change pushed to that branch see the token before
    # anyone reviewed it.
    uses: BPForbes/Bailey-Forbes-Portfolio-Site.github.io/.github/workflows/notify-portfolio.yml@52b4093c6ddb4b6a4dddd220a3284b87cdcbbc14
    with:
      project: keyquorum
      sha: ${{ github.event.workflow_run.head_sha }}
      ref: ${{ github.event.workflow_run.head_branch }}
      source-workflow: ${{ github.event.workflow_run.name }}
    secrets:
      PORTFOLIO_DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
