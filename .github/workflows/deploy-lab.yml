# Builds, tests, and publishes KeyQuorum Lab (lab/) to GitHub Pages:
#
#   native tests -> provider/lab guard -> WASM build -> frontend build
#   -> browser tests -> project metadata -> Pages deploy
#
# Pull requests run everything except the deploy. Only a push to main (or a
# manual run on main) publishes, and notify-portfolio.yml tells
# bailey-forbes.com only after the job named "Publish KeyQuorum Lab to
# GitHub Pages" succeeded, so the portfolio never advertises a commit that
# is not live.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

name: Deploy KeyQuorum Lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Declaring this block sets every unlisted permission to none, and the
  # metadata generation step (scripts/generate-project-metadata.mjs, on
  # push to main) calls GitHub's pulls/pulls-commits REST endpoints with
  # GITHUB_TOKEN to build the timeline.
  pull-requests: read

concurrency:
  group: deploy-lab-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full suite, as the parallel groups of tests.yml (lab, cli,
  # file_history, relay+provider+db, core), each in its own job with the
  # shared `standard` cache. The checks are named "Native KeyQuorum tests /
  # <group>".
  native:
    name: Native KeyQuorum tests
    uses: ./.github/workflows/tests.yml
    with:
      features: --features provider,lab,tui
      cache-key: standard

  # One stable check name for the whole suite, whatever the groups are
  # called. Branch protection requires this job: a job that is skipped
  # because the tests failed would count as passing, this one fails.
  test:
    name: test
    needs: native
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test group passed
        run: test "${{ needs.native.result }}" = success

  build:
    name: Build and validate the lab
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Refuse a provider + lab WASM build
        # build.rs names the refusal; --keep-going lets cargo reach it past
        # provider dependencies that do not compile for wasm32 at all.
        run: |
          set -uo pipefail
          if cargo check --keep-going --locked --lib --target wasm32-unknown-unknown --features lab,provider > guard.log 2>&1; then
            echo "::error::a wasm32 build with both lab and provider compiled"
            exit 1
          fi
          grep -q "provider and lab builds are mutually exclusive" guard.log

      - name: Read the pinned wasm-bindgen version
        id: bindgen
        run: |
          set -euo pipefail
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - name: Install lab dependencies
        working-directory: lab
        run: npm ci

      - name: Build the lab WASM (lab feature only)
        working-directory: lab
        run: npm run build:wasm

      - name: Generate project metadata
        if: github.event_name != 'pull_request'
        working-directory: lab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          METADATA_OUTPUT: public/project-metadata.json
        run: npm run generate:metadata

      - name: Script tests
        working-directory: lab
        run: npm run test:scripts

      - name: Typecheck and build the frontend
        working-directory: lab
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Validate published metadata
        if: github.event_name != 'pull_request'
        working-directory: lab
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run validate:metadata

      - name: Install Chromium for browser tests
        working-directory: lab
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: lab
        env:
          CI: "true"
        run: npm run test:browser

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: lab/playwright-report
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: lab/dist

  deploy:
    # notify-portfolio.yml reads this job's conclusion by name.
    name: Publish KeyQuorum Lab to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
