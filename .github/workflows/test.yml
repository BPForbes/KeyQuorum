name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      features: --features provider,lab,tui
      cache-key: standard

  # One stable check name for the whole run, whatever the groups are called.
  test:
    name: test
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test group passed
        run: test "${{ needs.tests.result }}" = success
