# Readjusts a Dependabot Cargo PR to the versions RustSec recommends.
#
# Dependabot picks versions by semver alone and cannot react to a failing
# check, and its version updates never touch a transitive crate. When
# `cargo audit` (the `rust dependencies` job in security.yml) would fail on a
# Dependabot cargo branch, this job, for each lockfile that job audits (the
# root Cargo.lock and the standalone ffi/identity workspace's):
#   1. moves each flagged crate to the newest version its dependents allow
#      (`cargo update -p name@version`);
#   2. for each crate still flagged, looks up the newest published release
#      that every one of its advisories calls patched, and moves to it: a
#      direct dependency gets its Cargo.toml requirement raised (a new major
#      version included), a transitive one is pinned with
#      `cargo update --precise` if its dependents accept it;
#   3. audits again and commits the changed Cargo.toml and Cargo.lock files
#      to the same branch only if the audit improved.
# What still cannot move (a dependent that does not accept the patched
# release yet, or no patched release published) is named in a PR comment and
# the job fails, so a person decides. A major bump may need code changes; the
# re-run checks show it. It never merges (dependabot-auto-merge.yml merges a
# Dependabot PR only once every check on it is green) and never adds an advisory ignore;
# it honours the exceptions already recorded in .cargo/audit.toml.
#
# The same job also refreshes a lockfile the other workspace left stale.
# Dependabot keeps a cargo entry per workspace. An update under /ffi/identity
# follows that crate's path dependency on the root and rewrites the root
# Cargo.toml plus ffi/identity/Cargo.lock, but not the root Cargo.lock. A root
# update does the reverse. Either one makes every `cargo --locked` check fail
# (`cannot update the lock file ... because --locked was passed`) before the
# code is even built, which is why those pull requests never go green and
# never auto-merge. When `cargo metadata --locked` fails for that reason, the
# job runs `cargo metadata` (no `--locked`), which rewrites only the packages
# the manifest no longer accepts and does not float the rest the way
# `cargo update` with no `-p` does, then commits that lockfile even when
# `cargo audit` is already clean and re-dispatches the checks. A major bump
# can still need source changes; this only removes the stale-lockfile failure.
#
# The job holds a write token, so it never checks out the PR. It reads only
# the two Cargo.toml and Cargo.lock pairs and .cargo/audit.toml from the PR's head commit
# through the API, runs cargo on them in an empty directory (no
# .cargo/config.toml or rust-toolchain.toml from the branch is ever seen, and
# `cargo update` and `cargo audit` run no build script), and writes one
# commit through the Git Data API whose ref update is refused unless it
# fast-forwards the commit it read.
#
# A commit made with GITHUB_TOKEN starts no pull_request run, so the job
# re-dispatches the PR's workflows (security, lint, deploy-lab, workers) on
# the branch; their deploy and publish steps are gated on main and do not run.
# That commit also starts no run of this workflow, so it cannot loop.
#
# `@dependabot rebase` or `recreate` drops the fix commit; the resulting
# synchronize event runs this job again and re-applies it.
#
# The same job also runs daily on main (and by hand from main). Advisories
# appear without any change here, and before this run a fix could only land
# on a Dependabot branch whose checks must pass first, so main and every other
# branch stayed red in the meantime. On main the readjusted files are
# committed on top of main to the bot-owned branch security/rustsec-readjust
# (reset to main plus that one commit on each run that changes it, so do not
# push to it by hand) and one pull request from it is opened or updated. It
# still never merges. Opening that pull request needs the repository setting
# "Allow GitHub Actions to create and approve pull requests"; without it the
# branch is still pushed and the run fails saying so.

name: Dependabot security fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-security-fix-${{ github.head_ref || 'main' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  cargo:
    name: dependabot security fix (cargo)
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'dependabot/cargo/')) ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit the readjusted Cargo.toml and Cargo.lock to the Dependabot branch or security/rustsec-readjust
      actions: write # re-dispatch the checks a GITHUB_TOKEN commit does not start
      pull-requests: write # report what changed and what remains, or open the readjust pull request
    env:
      # The commit read: the PR head, or main's head on a scheduled run.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Where the fix commit goes on main.
      FIX_BRANCH: security/rustsec-readjust
    steps:
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit

      - name: Fetch the Cargo manifests and lockfiles from the PR head (or main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # Every workspace security.yml audits: the root crate and the
          # standalone ffi/identity workspace, which has its own Cargo.lock.
          for f in Cargo.toml Cargo.lock ffi/identity/Cargo.toml ffi/identity/Cargo.lock; do
            mkdir -p "lock/$(dirname "$f")"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$REPO/contents/$f?ref=$HEAD_SHA" > "lock/$f"
          done
          # ffi/identity's library target is discovered from src/lib.rs, which
          # cargo needs to exist to read the manifest. An empty placeholder is
          # enough for `cargo update`; it is never committed. (The root
          # manifest names its targets' paths explicitly.)
          mkdir -p lock/ffi/identity/src
          : > lock/ffi/identity/src/lib.rs
          # The advisory exceptions security.yml's cargo audit honours (their
          # reasons and dates are in deny.toml). cargo audit reads them from
          # .cargo/audit.toml in the directory it runs in; the file is optional.
          mkdir .cargo
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$REPO/contents/.cargo/audit.toml?ref=$HEAD_SHA" > .cargo/audit.toml \
            || rm -f .cargo/audit.toml
          cp -r lock before

      - name: Audit, readjust flagged crates, audit again
        id: fix
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # A cargo update in one workspace can change the other workspace's
          # manifest through the path dependency and leave that workspace's
          # lockfile stale. Refresh only a lockfile cargo reports as stale.
          # `cargo metadata` without --locked rewrites the packages the
          # manifest no longer accepts; it does not float every dependency.
          for ws in "" "ffi/identity/"; do
            dir="lock/$ws"
            err="${dir}locked.err"
            if cargo +stable metadata --locked --format-version 1 --manifest-path "${dir}Cargo.toml" >/dev/null 2>"$err"; then
              echo "${dir}Cargo.lock matches its manifest."
              continue
            fi
            if ! grep -q 'because --locked was passed' "$err"; then
              echo "::error::cargo metadata --locked failed for ${dir}Cargo.toml"
              cat "$err"
              exit 1
            fi
            echo "${dir}Cargo.lock is stale; refreshing it to match the manifest."
            cargo +stable metadata --format-version 1 --manifest-path "${dir}Cargo.toml" >/dev/null
          done
          # cargo audit exits 1 on findings; its JSON is what matters.
          flagged() {
            jq -r '[.vulnerabilities.list[].package, (.warnings // {} | .[][].package)]
                   | map("\(.name)@\(.version)") | unique[]' "$1"
          }
          advisories() {
            jq -r '[.vulnerabilities.list[], (.warnings // {} | .[][])]
                   | map(select(.advisory != null)
                         | "| \(.package.name) | \(.package.version) | \(.advisory.id) | \((.versions.patched // []) | join(", ")) |")
                   | unique[]' "$1"
          }
          # Each workspace's prefix inside the repository ("" is the root).
          before_n=0
          after_n=0
          changed=0
          : > report.md
          for ws in "" "ffi/identity/"; do
            dir="lock/$ws"
            out="out/$ws"
            mkdir -p "$out"
            cargo audit --file "${dir}Cargo.lock" --json > "${out}before.json" || true
            jq -e '.vulnerabilities' "${out}before.json" > /dev/null

            mapfile -t pkgs < <(flagged "${out}before.json")
            if [ "${#pkgs[@]}" -eq 0 ]; then
              echo "${ws}Cargo.lock passes cargo audit; nothing to readjust."
              continue
            fi
            before_n=$((before_n + ${#pkgs[@]}))

            for pkg in "${pkgs[@]}"; do
              echo "::group::cargo update -p $pkg (${ws}Cargo.toml)"
              cargo +stable update --manifest-path "${dir}Cargo.toml" -p "$pkg" \
                || echo "::warning::cargo update -p $pkg failed in ${ws}Cargo.toml"
              echo "::endgroup::"
            done
            cargo audit --file "${dir}Cargo.lock" --json > "${out}after.json" || true
            jq -e '.vulnerabilities' "${out}after.json" > /dev/null

            # Second pass: the newest release the advisories call patched.
            : > "${out}advice.md"
            if [ "$(flagged "${out}after.json" | wc -l)" -gt 0 ]; then
              python3 - "${out}after.json" "${dir}Cargo.toml" "${out}advice.md" <<'PY'
          import json, pathlib, re, subprocess, sys, tomllib, urllib.request

          # Second pass for crates `cargo update -p` could not clear: move each to the
          # newest release its advisories call patched. A direct dependency gets its
          # Cargo.toml requirement raised; a transitive one is pinned with
          # `cargo update --precise` if its dependents allow it, else its blocker is
          # reported. Writes one Markdown line per crate to advice.md.
          audit = json.load(open(sys.argv[1]))
          manifest = pathlib.Path(sys.argv[2])
          SECTIONS = ("dependencies", "dev-dependencies", "build-dependencies")


          def parse(v):
              core, _, pre = v.partition("+")[0].partition("-")
              parts = [int(x) for x in core.split(".")]
              return tuple(parts + [0] * (3 - len(parts))), pre


          def satisfies(ver, req):
              """Cargo VersionReq: comma is AND; no operator means caret."""
              v, _ = parse(ver)
              for comp in req.split(","):
                  m = re.fullmatch(r"\s*(>=|<=|>|<|=|\^|~)?\s*([0-9][0-9.]*)\s*", comp)
                  if not m:
                      return False
                  op, raw = m.group(1) or "^", m.group(2)
                  given = len(raw.split("."))
                  b, _ = parse(raw)
                  if op == ">=" and not v >= b: return False
                  if op == ">" and not v > b: return False
                  if op == "<=" and not v <= b: return False
                  if op == "<" and not v < b: return False
                  if op == "=" and v[:given] != b[:given]: return False
                  if op in ("^", "~"):
                      if v < b: return False
                      if op == "~":
                          upper = (b[0] + 1, 0, 0) if given == 1 else (b[0], b[1] + 1, 0)
                      elif b[0] > 0 or given == 1:
                          upper = (b[0] + 1, 0, 0)
                      elif b[1] > 0 or given == 2:
                          upper = (0, b[1] + 1, 0)
                      else:
                          upper = (0, 0, b[2] + 1)
                      if not v < upper: return False
              return True


          def releases(name):
              n = name.lower()
              path = (f"{len(n)}/{n}" if len(n) <= 2 else
                      f"3/{n[0]}/{n}" if len(n) == 3 else f"{n[:2]}/{n[2:4]}/{n}")
              req = urllib.request.Request(f"https://index.crates.io/{path}",
                                           headers={"User-Agent": "keyquorum-dependabot-security-fix"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  for line in r.read().decode().splitlines():
                      e = json.loads(line)
                      if not e.get("yanked") and not parse(e["vers"])[1]:
                          yield e["vers"]


          def direct_keys(doc, name, version):
              """Keys declaring `name` whose requirement covers the flagged version (a
              crate can be declared twice, e.g. getrandom and getrandom_04)."""
              tables = [doc.get(s, {}) for s in SECTIONS]
              for t in doc.get("target", {}).values():
                  tables += [t.get(s, {}) for s in SECTIONS]
              for t in tables:
                  for key, spec in t.items():
                      pkg = spec.get("package", key) if isinstance(spec, dict) else key
                      req = spec.get("version", "") if isinstance(spec, dict) else spec
                      if pkg == name and req and satisfies(version, req):
                          yield key


          def caret(ver):
              (a, b, c), _ = parse(ver)
              return f"{a}" if a else f"0.{b}" if b else f"0.0.{c}"


          def cargo(*args):
              return subprocess.run(["cargo", "+stable", *args, "--manifest-path", str(manifest)],
                                    capture_output=True, text=True)


          flagged = {}
          for v in audit["vulnerabilities"]["list"] + [w for ws in (audit.get("warnings") or {}).values() for w in ws]:
              p = v["package"]
              patched = (v.get("versions") or {}).get("patched") or []
              flagged.setdefault((p["name"], p["version"]), []).append(patched)

          out = []
          for (name, version), patched_sets in sorted(flagged.items()):
              if any(not s for s in patched_sets):
                  out.append(f"- `{name} {version}`: an advisory names no patched release; needs a person.")
                  continue
              ok = [r for r in releases(name)
                    if all(any(satisfies(r, req) for req in s) for s in patched_sets)]
              if not ok:
                  out.append(f"- `{name} {version}`: no published release is patched yet.")
                  continue
              target = max(ok, key=lambda r: parse(r)[0])
              keys = sorted(set(direct_keys(tomllib.loads(manifest.read_text()), name, version)))
              if keys:
                  text, req, edits = manifest.read_text(), caret(target), 0
                  for key in keys:
                      k = re.escape(key)
                      for pat in (rf'(?m)^(\s*{k}\s*=\s*")[^"]*(")',
                                  rf'(?m)^(\s*{k}\s*=\s*\{{[^}}\n]*?\bversion\s*=\s*")[^"]*(")'):
                          text, n = re.subn(pat, rf"\g<1>{req}\g<2>", text)
                          edits += n
                  if not edits:
                      out.append(f"- `{name} {version}`: direct dependency, but its requirement is not on one line; raise it to `{req}` by hand.")
                      continue
                  if text == manifest.read_text():
                      out.append(f"- `{name} {version}` → `{target}`: the Cargo.toml requirement already allows it, but the lockfile would not move.")
                      continue
                  manifest.write_text(text)
                  r = cargo("update", "-p", f"{name}@{version}")
                  if r.returncode:
                      r = cargo("metadata", "--format-version", "1")
                  out.append(f"- `{name} {version}` → `{target}`: raised the Cargo.toml requirement to `\"{req}\"`."
                             if r.returncode == 0 else
                             f"- `{name} {version}` → `{target}`: raised the Cargo.toml requirement to `\"{req}\"`, but it does not resolve: `{r.stderr.strip().splitlines()[-1]}`")
              else:
                  r = cargo("update", "-p", f"{name}@{version}", "--precise", target)
                  if r.returncode == 0:
                      out.append(f"- `{name} {version}` → `{target}`: pinned with `cargo update --precise`.")
                  else:
                      why = " ".join(l.strip() for l in r.stderr.splitlines() if "required by" in l or "versions that meet" in l)
                      out.append(f"- `{name} {version}` → `{target}`: transitive, and a dependent does not accept it yet ({why or r.stderr.strip().splitlines()[-1]}).")
          pathlib.Path(sys.argv[3]).write_text("\n".join(out) + ("\n" if out else ""))
          print("\n".join(out))
          PY
            fi
            cargo audit --file "${dir}Cargo.lock" --json > "${out}final.json" || true
            jq -e '.vulnerabilities' "${out}final.json" > /dev/null

            left=$(flagged "${out}final.json" | wc -l)
            after_n=$((after_n + left))
            if ! { cmp -s "before/${ws}Cargo.lock" "${dir}Cargo.lock" \
                   && cmp -s "before/${ws}Cargo.toml" "${dir}Cargo.toml"; }; then
              changed=1
            fi
            {
              echo "## \`${ws}Cargo.lock\`"
              echo
              echo "### Flagged before"
              echo "| crate | version | advisory | patched |"
              echo "| --- | --- | --- | --- |"
              advisories "${out}before.json"
              if [ -s "${out}advice.md" ]; then
                echo
                echo "### Recommended releases"
                cat "${out}advice.md"
              fi
              echo
              echo "### Cargo.toml changes"
              echo '```'
              { diff -U0 "before/${ws}Cargo.toml" "${dir}Cargo.toml" || true; } | grep -E '^[-+][^-+]' || echo "(none)"
              echo '```'
              echo
              echo "### Lockfile changes"
              echo '```'
              { diff -U1 "before/${ws}Cargo.lock" "${dir}Cargo.lock" || true; } | grep -E '^( name|[-+]name|[-+]version) ' || echo "(none)"
              echo '```'
              if [ "$left" -gt 0 ]; then
                echo
                echo "### Still flagged"
                echo "No published release clears these that this graph accepts (see above for the crate holding each back). They need an upstream release, a dependency change, or a recorded exception, which is a person's decision."
                echo "| crate | version | advisory | patched |"
                echo "| --- | --- | --- | --- |"
                advisories "${out}final.json"
              fi
              echo
            } >> report.md
          done
          cat report.md

          stale=0
          for f in Cargo.toml Cargo.lock ffi/identity/Cargo.toml ffi/identity/Cargo.lock; do
            cmp -s "before/$f" "lock/$f" || stale=1
          done
          if [ "$before_n" -eq 0 ]; then
            if [ "$stale" -eq 1 ]; then
              echo "cargo audit is clean, and a stale lockfile was refreshed."
              {
                echo "## Lockfile"
                echo
                echo "Refreshed the lockfile the other workspace left stale:"
                echo
                for f in Cargo.lock ffi/identity/Cargo.lock; do
                  cmp -s "before/$f" "lock/$f" && continue
                  echo "### \`$f\`"
                  echo '```'
                  { diff -U1 "before/$f" "lock/$f" || true; } | grep -E '^( name|[-+]name|[-+]version) ' || echo "(no package lines)"
                  echo '```'
                  echo
                done
              } >> report.md
              echo "result=lockfile" >> "$GITHUB_OUTPUT"
            else
              echo "Every Cargo.lock passes cargo audit; nothing to readjust."
              echo "result=clean" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$changed" -eq 0 ] || [ "$after_n" -ge "$before_n" ]; then
            echo "result=unfixed" >> "$GITHUB_OUTPUT"
          elif [ "$after_n" -gt 0 ]; then
            echo "result=partial" >> "$GITHUB_OUTPUT"
          else
            echo "result=fixed" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the readjusted manifests and lockfiles and re-run the checks
        id: commit
        if: steps.fix.outputs.result == 'fixed' || steps.fix.outputs.result == 'partial' || steps.fix.outputs.result == 'lockfile'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          RESULT: ${{ steps.fix.outputs.result }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ids=$(find out -name before.json -exec cat {} + \
                | jq -rs '[.[] | .vulnerabilities.list[], (.warnings // {} | .[][])]
                          | map(.advisory.id // empty) | unique | join(", ")')
          # One commit for every changed file, on top of the commit that was read.
          entries='[]'
          for f in Cargo.toml Cargo.lock ffi/identity/Cargo.toml ffi/identity/Cargo.lock; do
            cmp -s "before/$f" "lock/$f" && continue
            base64 -w0 "lock/$f" > blob.b64
            jq -n --rawfile content blob.b64 '{content: $content, encoding: "base64"}' > blob.json
            blob=$(gh api -X POST "repos/$REPO/git/blobs" --input blob.json --jq .sha)
            entries=$(jq -c --arg path "$f" --arg sha "$blob" \
              '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' <<<"$entries")
          done
          base_tree=$(gh api "repos/$REPO/git/commits/$HEAD_SHA" --jq .tree.sha)
          tree=$(jq -n --arg base "$base_tree" --argjson tree "$entries" '{base_tree: $base, tree: $tree}' \
            | gh api -X POST "repos/$REPO/git/trees" --input - --jq .sha)
          if [ "$RESULT" = "lockfile" ]; then
            message=$(printf '%s\n\n%s' \
              'chore(deps): refresh the lockfile Dependabot left stale' \
              'A cargo update in one workspace rewrote that lockfile and, through the path dependency, the other workspace'\''s manifest, but not its lockfile. Every --locked check then fails. This rewrites only the stale lockfile.')
          else
            message=$(printf 'chore(deps): readjust to RustSec-recommended versions\n\nAdvisories flagged before: %s' "$ids")
          fi
          commit=$(jq -n --arg tree "$tree" --arg parent "$HEAD_SHA" \
                     --arg message "$message" \
                     '{message: $message, tree: $tree, parents: [$parent]}' \
            | gh api -X POST "repos/$REPO/git/commits" --input - --jq .sha)
          if [ -n "$HEAD_REF" ]; then
            # A Dependabot branch. force=false: refused unless the branch is
            # still at HEAD_SHA.
            jq -n --arg sha "$commit" '{sha: $sha, force: false}' \
              | gh api -X PATCH "repos/$REPO/git/refs/heads/$HEAD_REF" --input - --jq .object.sha
            target="$HEAD_REF"
          else
            # main: the bot-owned branch becomes main plus this commit, unless
            # it already holds exactly this tree (nothing new, no re-run).
            target="$FIX_BRANCH"
            current=$(gh api "repos/$REPO/git/ref/heads/$FIX_BRANCH" --jq .object.sha 2>/dev/null || true)
            if [ -z "$current" ]; then
              jq -n --arg ref "refs/heads/$FIX_BRANCH" --arg sha "$commit" '{ref: $ref, sha: $sha}' \
                | gh api -X POST "repos/$REPO/git/refs" --input - --jq .object.sha
            elif [ "$(gh api "repos/$REPO/git/commits/$current" --jq .tree.sha)" = "$tree" ]; then
              echo "$FIX_BRANCH already holds this readjustment; nothing to update."
              echo "updated=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              jq -n --arg sha "$commit" '{sha: $sha, force: true}' \
                | gh api -X PATCH "repos/$REPO/git/refs/heads/$FIX_BRANCH" --input - --jq .object.sha
            fi
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"
          for wf in security.yml lint.yml deploy-lab.yml workers.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref "$target"
          done

      - name: Report on the pull request
        if: >-
          (steps.fix.outputs.result == 'fixed' || steps.fix.outputs.result == 'partial' || steps.fix.outputs.result == 'unfixed' || steps.fix.outputs.result == 'lockfile') &&
          steps.commit.outputs.updated != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RESULT: ${{ steps.fix.outputs.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          case "$RESULT" in
            fixed) head="cargo audit failed on this branch. The flagged crates were moved to patched versions and the checks re-run." ;;
            partial) head="cargo audit failed on this branch. Some flagged crates were moved to patched versions and the checks re-run; the rest need a person." ;;
            lockfile) head="A Dependabot cargo update left one workspace's Cargo.lock stale, because the path dependency changed the other workspace's manifest without rewriting its lockfile. The stale lockfile was refreshed and the checks re-run." ;;
            *) head="cargo audit fails on this branch and no release this graph accepts clears it; nothing was committed." ;;
          esac
          if [ -z "$PR_URL" ]; then
            head="${head/this branch/main}"
          fi
          {
            echo "$head"
            echo
            cat report.md
            echo
            echo "[Run]($RUN_URL)"
          } > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_URL" ]; then
            gh pr comment "$PR_URL" --body-file body.md
            exit 0
          fi
          # main: nothing to open when nothing was committed.
          [ "$RESULT" = unfixed ] && exit 0
          open=$(gh pr list --repo "$REPO" --head "$FIX_BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [ -n "$open" ]; then
            gh pr edit "$open" --repo "$REPO" --body-file body.md
          elif ! gh pr create --repo "$REPO" --base main --head "$FIX_BRANCH" \
                 --title "$(if [ "$RESULT" = lockfile ]; then echo 'chore(deps): refresh the lockfile Dependabot left stale'; else echo 'chore(deps): readjust to RustSec-recommended versions'; fi)" --body-file body.md; then
            echo "::error::Pushed $FIX_BRANCH but could not open its pull request. Enable \"Allow GitHub Actions to create and approve pull requests\" (Settings, Actions, General) or open it by hand."
            exit 1
          fi

      - name: Fail while advisories remain
        if: steps.fix.outputs.result == 'partial' || steps.fix.outputs.result == 'unfixed'
        run: |
          echo "::error::RustSec advisories remain that no accepted release clears; see the PR comment or this run's summary."
          exit 1
