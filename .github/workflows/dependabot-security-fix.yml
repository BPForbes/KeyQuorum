# Readjusts a Dependabot Cargo PR whose lockfile fails RustSec.
#
# Dependabot picks versions by semver alone and cannot react to a failing
# check, and its version updates never touch a transitive crate. When
# `cargo audit` (the `rust dependencies` job in security.yml) would fail on a
# Dependabot cargo branch, this job moves each flagged crate to the newest
# version its dependents allow (`cargo update -p name@version`), audits again,
# and commits the new Cargo.lock to the same branch only if the audit then
# improves. A fix that needs a major version, a Cargo.toml change or an
# upstream release is not attempted: the job comments what remains and fails,
# so a person decides. It never merges (cargo updates always wait for a
# person, see dependabot-auto-merge.yml) and never adds an advisory ignore.
#
# The job holds a write token, so it never checks out the PR. It reads only
# Cargo.toml and Cargo.lock from the PR's head commit through the API, runs
# cargo on those two files in an empty directory (no .cargo/config.toml or
# rust-toolchain.toml from the branch is ever seen, and `cargo update` and
# `cargo audit` run no build script), and writes Cargo.lock back through the
# contents API, which refuses the write if the branch's Cargo.lock changed
# in the meantime.
#
# A commit made with GITHUB_TOKEN starts no pull_request run, so the job
# re-dispatches the PR's workflows (security, lint, deploy-lab, workers) on
# the branch; their deploy and publish steps are gated on main and do not run.
# That commit also starts no run of this workflow, so it cannot loop.
#
# `@dependabot rebase` or `recreate` drops the fix commit; the resulting
# synchronize event runs this job again and re-applies it.

name: Dependabot security fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-security-fix-${{ github.head_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  cargo:
    name: dependabot security fix (cargo)
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/cargo/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # commit the readjusted Cargo.lock to the Dependabot branch
      actions: write # re-dispatch the checks a GITHUB_TOKEN commit does not start
      pull-requests: write # report what changed and what remains
    steps:
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-audit

      - name: Fetch Cargo.toml and Cargo.lock from the PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir lock
          for f in Cargo.toml Cargo.lock; do
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$REPO/contents/$f?ref=$HEAD_SHA" > "lock/$f"
          done
          gh api "repos/$REPO/contents/Cargo.lock?ref=$HEAD_SHA" --jq .sha > lock-blob.txt
          # The advisory exceptions security.yml's cargo audit honours (their
          # reasons and dates are in deny.toml). cargo audit reads them from
          # .cargo/audit.toml in the directory it runs in; the file is optional.
          mkdir .cargo
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$REPO/contents/.cargo/audit.toml?ref=$HEAD_SHA" > .cargo/audit.toml \
            || rm -f .cargo/audit.toml
          cp lock/Cargo.lock before.lock

      - name: Audit, readjust flagged crates, audit again
        id: fix
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # cargo audit exits 1 on findings; its JSON is what matters.
          flagged() {
            jq -r '[.vulnerabilities.list[].package, (.warnings // {} | .[][].package)]
                   | map("\(.name)@\(.version)") | unique[]' "$1"
          }
          advisories() {
            jq -r '[.vulnerabilities.list[], (.warnings // {} | .[][])]
                   | map(select(.advisory != null)
                         | "| \(.package.name) | \(.package.version) | \(.advisory.id) | \((.versions.patched // []) | join(", ")) |")
                   | unique[]' "$1"
          }
          cargo audit --file lock/Cargo.lock --json > before.json || true
          jq -e '.vulnerabilities' before.json > /dev/null

          mapfile -t pkgs < <(flagged before.json)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "Cargo.lock passes cargo audit; nothing to readjust."
            echo "result=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for pkg in "${pkgs[@]}"; do
            echo "::group::cargo update -p $pkg"
            cargo +stable update --manifest-path lock/Cargo.toml -p "$pkg" \
              || echo "::warning::cargo update -p $pkg failed"
            echo "::endgroup::"
          done
          cargo audit --file lock/Cargo.lock --json > after.json || true
          jq -e '.vulnerabilities' after.json > /dev/null

          before_n=$(flagged before.json | wc -l)
          after_n=$(flagged after.json | wc -l)
          {
            echo "### Flagged before"
            echo "| crate | version | advisory | patched |"
            echo "| --- | --- | --- | --- |"
            advisories before.json
            echo
            echo "### Lockfile changes"
            echo '```'
            { diff -U1 before.lock lock/Cargo.lock || true; } | grep -E '^( name|[-+]name|[-+]version) ' || echo "(none)"
            echo '```'
          } > report.md
          if [ "$after_n" -gt 0 ]; then
            {
              echo
              echo "### Still flagged"
              echo "No semver-compatible version clears these. They need a Cargo.toml change, an upstream release, or a recorded exception, which is a person's decision."
              echo "| crate | version | advisory | patched |"
              echo "| --- | --- | --- | --- |"
              advisories after.json
            } >> report.md
          fi
          cat report.md

          if cmp -s before.lock lock/Cargo.lock || [ "$after_n" -ge "$before_n" ]; then
            echo "result=unfixed" >> "$GITHUB_OUTPUT"
          elif [ "$after_n" -gt 0 ]; then
            echo "result=partial" >> "$GITHUB_OUTPUT"
          else
            echo "result=fixed" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the readjusted Cargo.lock and re-run the checks
        if: steps.fix.outputs.result == 'fixed' || steps.fix.outputs.result == 'partial'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ids=$(jq -r '[.vulnerabilities.list[], (.warnings // {} | .[][])]
                       | map(.advisory.id // empty) | unique | join(", ")' before.json)
          base64 -w0 lock/Cargo.lock > lock.b64
          jq -n --rawfile content lock.b64 --arg sha "$(cat lock-blob.txt)" \
                --arg branch "$HEAD_REF" \
                --arg message "$(printf 'chore(deps): readjust Cargo.lock for RustSec advisories\n\nAdvisories flagged before: %s' "$ids")" \
                '{message: $message, content: $content, sha: $sha, branch: $branch}' > body.json
          gh api -X PUT "repos/$REPO/contents/Cargo.lock" --input body.json --jq .commit.sha
          for wf in security.yml lint.yml deploy-lab.yml workers.yml; do
            gh workflow run "$wf" --repo "$REPO" --ref "$HEAD_REF"
          done

      - name: Report on the pull request
        if: steps.fix.outputs.result == 'fixed' || steps.fix.outputs.result == 'partial' || steps.fix.outputs.result == 'unfixed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RESULT: ${{ steps.fix.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          case "$RESULT" in
            fixed) head="cargo audit failed on this branch. The flagged crates were moved to patched versions and the checks re-run." ;;
            partial) head="cargo audit failed on this branch. Some flagged crates were moved to patched versions and the checks re-run; the rest need a person." ;;
            *) head="cargo audit fails on this branch and no semver-compatible version clears it; nothing was committed." ;;
          esac
          {
            echo "$head"
            echo
            cat report.md
            echo
            echo "[Run]($RUN_URL)"
          } > body.md
          gh pr comment "$PR_URL" --body-file body.md

      - name: Fail while advisories remain
        if: steps.fix.outputs.result == 'partial' || steps.fix.outputs.result == 'unfixed'
        run: |
          echo "::error::RustSec advisories remain on this branch that no compatible update clears; see the PR comment."
          exit 1
