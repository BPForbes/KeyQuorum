# The deployment assets under deploy/ and the container image: the Helm
# chart must lint and render to manifests that pass schema validation, and
# the image must build with the provider and mongodb features, run as a
# non-root user and hold no key, certificate or database file. Nothing here publishes an image or touches a cluster.

name: Deployment assets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to a pull request cancels the run for the commit it replaced, so a
# superseded commit never holds a runner. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chart:
    name: helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint
        run: helm lint deploy/kubernetes/keyquorum-relay --strict
      - name: Render (defaults, external secrets, CSI)
        run: |
          mkdir -p rendered
          helm template relay deploy/kubernetes/keyquorum-relay --namespace keyquorum \
            > rendered/default.yaml
          helm template relay deploy/kubernetes/keyquorum-relay --namespace keyquorum \
            --set secrets.externalSecrets.enabled=true --set autoscaling.enabled=true \
            > rendered/external-secrets.yaml
          helm template relay deploy/kubernetes/keyquorum-relay --namespace keyquorum \
            --set secrets.csi.enabled=true > rendered/csi.yaml
      # Core resources against the Kubernetes schemas; the ExternalSecret
      # and SecretProviderClass kinds are custom resources and are skipped.
      - name: Validate rendered manifests
        run: |
          docker run --rm -v "$PWD/rendered:/rendered" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.30.0 \
            -skip ExternalSecret,SecretProviderClass /rendered
      - name: No credential is rendered
        run: |
          # -l prints only the names of matching files, never the match.
          if grep -Eil 'kq_[A-Za-z0-9_-]{20,}|kql_|BEGIN (RSA|EC|OPENSSH)|mongodb(\+srv)?://[^/@]+@' rendered/*.yaml; then
            echo "a credential-shaped value was rendered into the manifests"
            exit 1
          fi

  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (provider + mongodb)
        run: docker build --tag keyquorum-relay:ci .
      - name: Runs as a non-root user with the provider commands compiled in
        run: |
          docker run --rm --user 65532:65532 keyquorum-relay:ci host serve --help >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' keyquorum-relay:ci)" = "65532:65532"
      # The merged filesystem of the image (`docker export`), not the layer
      # tarballs, so the names inside are what is listed. The final stage
      # copies one binary onto a distroless base, so this is every file the
      # image holds.
      - name: The image holds no key, certificate or database file
        run: |
          cid=$(docker create keyquorum-relay:ci)
          docker export "$cid" | tar -t > image-files.txt
          docker rm "$cid" >/dev/null
          test -s image-files.txt
          grep -q 'usr/local/bin/keyquorum' image-files.txt
          # The base image's public CA roots (etc/ssl/certs, the CA package's
          # share directory) are not ours and are expected; anything else
          # secret-shaped is a failure. Only file names are printed.
          if grep -Ev '^(etc/ssl/certs/|usr/share/ca-certificates/)' image-files.txt \
              | grep -Ei '\.(key|pem|kqcert|kqrl|kqpolicy|kqkey|kqpb|sqlite|db)$|device\.skey'; then
            echo "a secret-shaped file is in the image"
            exit 1
          fi
