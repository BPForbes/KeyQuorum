# Cloudflare Worker for the KeyQuorum relay (production is the top level,
# staging is [env.staging], deployed as keyquorum-relay-staging).
#
# Stage 2 ships a health-only stub so the deployment check can be proven
# before the relay exists; see docs/operator/relay-hosting.md.
#
# Nothing secret belongs in this file. The relay key, provider.kqcert and
# provider.kqrl are Worker secrets the operator sets with `wrangler secret
# put`, never a [vars] entry and never a GitHub secret. scripts/guard.mjs
# fails CI if this file or the built bundle holds key material, a secret-like
# [vars] or [previews.vars] name, or a Durable Object migration that deletes
# or renames a class (which destroys its data).
#
# There is deliberately no route here: the hostname is a Worker custom
# domain managed in deploy/cloudflare/terraform, and workers.dev stays off so
# one hostname carries the relay's identity. Preview URLs are on for this
# Worker only (owner decision 2026-10-06), and the guard accepts that only for
# this file. They serve Worker Previews, which is what Cloudflare Workers Builds
# runs for a branch that is not `main` (`npm run preview`, that is `wrangler
# preview`) once the owner connects this repository to the Worker, the way the
# portfolio site is connected; see "Workers Builds and previews" in
# docs/operator/relay-hosting.md for the settings. A Preview takes nothing from
# production: it has its own code, its own Durable Object namespace once one
# exists, and only the secrets set for Previews (none), so it holds no relay
# key and no letter. `previews` below is where a Preview's own settings would
# go; it is empty on purpose, since the stub needs none, and wrangler requires
# the block. The staging environment has none: Workers Builds is not connected
# to it. The admin Worker never gets previews: its hostname sits behind Access
# and a preview hostname does not.
name = "keyquorum-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = true
previews = { }

[env.staging]
workers_dev = false
preview_urls = true
