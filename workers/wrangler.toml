# Cloudflare Worker for the KeyQuorum relay (production is the top level,
# staging is [env.staging], deployed as keyquorum-relay-staging): the public
# Worker in src/worker.js and the one SQLite-backed Durable Object in
# src/relay-object.js that runs the relay core (relay-wasm/, built from the
# crate's `workers` feature by `npm run build:relay-wasm`; see
# docs/operator/relay-hosting.md).
#
# Nothing secret belongs in this file. The relay key (RELAY_PRIVATE_KEY, the file
# `host identity generate` writes) and provider.kqcert (RELAY_CERTIFICATE,
# base64) are Worker secrets the operator sets with `wrangler secret put` (see
# docs/operator/relay-deployment.md), never a [vars] entry and never a GitHub
# secret. scripts/guard.mjs fails CI if this file or the built bundle holds key
# material, a secret-like [vars] or [previews.vars] name, a wildcard
# ALLOWED_HOSTS outside [previews.vars], or a Durable Object migration that
# deletes or renames a class (which destroys its data).
#
# There is deliberately no route here: the hostname is a Worker custom
# domain managed in deploy/cloudflare/terraform, and workers.dev stays off so
# one hostname carries the relay's identity. Preview URLs are on for this
# Worker only (owner decision 2026-10-06), and the guard accepts that only for
# this file. `preview_urls` also makes the URL of every `wrangler deploy`
# version public, and such a version shares this Worker's bindings and secrets,
# so the Worker serves only the hosts in ALLOWED_HOSTS (the deploy job sets it
# to the custom domain, from the GitHub environment's RELAY_URL) and answers 404
# on any other, a Version URL included. Empty, it is unconfigured and serves
# nothing (503). A Worker Preview (what Cloudflare Workers Builds runs for a
# branch, `npm run preview`) takes nothing from production: it has its own code,
# its own empty Durable Object namespace and only the secrets set for Previews
# (none), so [previews.vars] may serve any host ("*"), and only there. The admin
# Worker never gets previews: its hostname sits behind Access and a preview
# hostname does not.
name = "keyquorum-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = true

# The relay: one Durable Object holds all of it, because the audit hash chain,
# the key tables and the key-delivery letters are written together.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayObject"]

# Large sealed letters are held in this bucket instead of the Durable Object's
# table (docs/operator/r2-blobs.md). The relay never opens a letter, so the
# bucket holds only bytes that are sealed to their recipients. It is created by
# deploy/cloudflare/terraform (`letters_bucket_name`) before the first deploy,
# is private (no public access, no custom domain), and is bound to this Worker
# only: not to the admin Worker, not to a Preview, and staging has its own.
# Nothing is held out while the binding is absent.
[[r2_buckets]]
binding = "LETTERS"
bucket_name = "keyquorum-letters"

# Sealed backups of the relay's database (docs/operator/r2-backups.md), written
# by the alarm when BACKUP_RECIPIENT (the operator's backup public key, a deploy
# variable and never a file: a 64-character key does not belong in this one) is
# set. Their own bucket, never the letters' one, and sealed to a key only the
# operator holds, so the bucket reveals nothing even to this Worker. Nothing is
# backed up while the binding or the key is absent.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "keyquorum-backups"

# PROVIDER_ROOT, the provider root public key the relay pins for its console's
# identity check, is a deploy variable too (workers.yml, from the environment's
# variable of that name), never a [vars] entry here, for the same reason.

# Per-client limit on customer routes, keyed on CF-Connecting-IP in the Worker,
# beside the zone's rate-limit rule (deploy/cloudflare/terraform/rules.tf). Not
# inherited by an environment, so staging repeats it. A namespace_id is an
# account-wide number: use one no other Worker in the account uses. The Worker
# runs without the binding if it is missing.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4701"
simple = { limit = 300, period = 60 }

# The version this Worker is (its id, tag and time), which the operator's status
# page shows. Not inherited by an environment, so staging repeats it.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Not secret: the hostname(s) this Worker answers, filled by the deploy job.
[vars]
ALLOWED_HOSTS = ""
# Not secret: letters of at least this many bytes are held in the R2 bucket (at
# least 4096; smaller ones stay in their row, atomic with everything else).
HOLD_LETTERS_FROM = "65536"
# Not secret: the path this Worker is mounted under on its host (src/mount.js).
# The deploy job sets it from the path of the environment's RELAY_URL; a value
# that is not `/relay` or `/relay/<name>` leaves the Worker unconfigured.
MOUNT_PATH = "/relay"

# What a Worker Preview starts with (it does not inherit the settings above).
[previews.vars]
ALLOWED_HOSTS = "*"
# A Preview's root path leads to the relay's status page (src/worker.js); on a
# real domain the root is not the relay's, so this is set nowhere else.
ROOT_REDIRECT = "1"

[[previews.durable_objects.bindings]]
name = "RELAY"
class_name = "RelayObject"

[env.staging]
workers_dev = false
preview_urls = true

[[env.staging.durable_objects.bindings]]
name = "RELAY"
class_name = "RelayObject"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RelayObject"]

[[env.staging.r2_buckets]]
binding = "LETTERS"
bucket_name = "keyquorum-letters-staging"

[[env.staging.r2_buckets]]
binding = "BACKUPS"
bucket_name = "keyquorum-backups-staging"

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4702"
simple = { limit = 300, period = 60 }

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.vars]
ALLOWED_HOSTS = ""
HOLD_LETTERS_FROM = "65536"
# The staging relay shares the production hostname, under its own path.
MOUNT_PATH = "/relay/staging-user"
