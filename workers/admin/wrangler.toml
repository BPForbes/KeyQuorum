# The admin Worker: a static operator page and, later, the relay's operator
# routes, on its own hostname behind a Cloudflare Access application with MFA.
# Production is the top level, staging is [env.staging]
# (keyquorum-relay-admin-staging).
#
# Nothing secret belongs here. The two [vars] are not secrets: they name the
# Access team and this application's audience tag, and the deploy job fills them
# in from the GitHub environment's variables. While they are empty the Worker
# fails closed and serves nothing. workers.dev and preview URLs stay off, there
# is no route (the hostname is a Worker custom domain managed in
# deploy/cloudflare/terraform), and src/index.js refuses any request without a
# valid Access token whatever the Access policy says. scripts/guard.mjs checks
# this file like the public Worker's.
name = "keyquorum-relay-admin"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[env.staging]
workers_dev = false
preview_urls = false

[env.staging.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[env.staging.vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
