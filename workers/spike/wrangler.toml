# THROWAWAY feasibility spike for issue #88 (stage 3). It is run only with
# `wrangler dev --local` and is never deployed: workers_dev and preview URLs
# are off, there are no routes, and it holds no secrets. It probes what a
# SQLite-backed Durable Object does with the relay's real schema, so the
# adopt/defer decision in docs/operator/relay-hosting.md rests on measured
# behaviour. See spike/README.md.
name = "keyquorum-spike"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "SPIKE"
class_name = "SpikeDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpikeDO"]

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = false
